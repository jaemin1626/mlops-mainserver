# ──────────────────────────────────────────────────────────────────────────
# 서버 주소 단일 관리 파일
#
#   주소는 여기 한 곳에만 적는다. 고친 뒤 아래를 실행하면
#   ClearML / 모니터링 / 학습 서버 배포 스크립트가 모두 같은 값을 쓴다.
#
#       /opt/clearml/packaging/apply-servers.sh
#
#   자격증명(API 키, 비밀번호, 토큰)은 여기가 아니라 각 .env 에 둔다.
#   apply-servers.sh 는 주소 관련 키만 건드리고 자격증명은 그대로 둔다.
#
#   형식: KEY=VALUE 만. shell 로 source 되고 python 에서도 파싱한다.
#         값에 공백이 있으면 따옴표로 감쌀 것.
# ──────────────────────────────────────────────────────────────────────────

# ── ClearML 서버 (이 스택이 도는 서버) ────────────────────────────────────
CLEARML_SERVER_IP=172.16.4.82
CLEARML_WEB_PORT=8080
CLEARML_API_PORT=8008
CLEARML_FILES_PORT=8081

# ── 모니터링 서버 ─────────────────────────────────────────────────────────
# ClearML 과 같은 서버면 CLEARML_SERVER_IP 와 똑같이 적는다.
# 같은 값이면 exporter 가 host.docker.internal 로 붙도록 자동 설정된다.
MONITORING_SERVER_IP=172.16.4.82
GRAFANA_PORT=3000
PROMETHEUS_PORT=9091
EXPORTER_PORT=9090

# ── 학습 서버 (데이터셋 등록 스크립트 배포 대상) ──────────────────────────
TRAINING_SERVER_IP=172.16.8.70
TRAINING_SERVER_USER=user

# ── 데이터셋 마운트 (Data Studio) ─────────────────────────────────────────
#   설정은 mount/config/dataset-mount.env 에만 적는다.
#   HOST_DATASET_PATH 가 compose → Data Studio /data/datasets 로 연결된다.

# ── 외부 연동 (exporter 부가 지표용, 비워도 동작함) ───────────────────────
TAGGING_TOOL_URL=http://172.16.4.178:5174
GITLAB_URL=http://172.16.4.88
GITLAB_PROJECT_IDS=135,289