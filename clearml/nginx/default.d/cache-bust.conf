# ──────────────────────────────────────────────────────────────
# / → /dashboard (브랜딩은 env.js / ivx-sidebar.* 로 적용)
# absolute_redirect off → :8080 포트 유지
# ──────────────────────────────────────────────────────────────

absolute_redirect off;

location = / {
    add_header Cache-Control "no-store" always;
    return 302 /dashboard;
}

# Never expose the stock ClearML login page. Authentication is handled by the
# DB-backed Intellivix login page.
location = /login {
    add_header Cache-Control "no-store" always;
    return 302 /access-login.html?next=%2Fdashboard;
}
