location = /settings/admin { return 302 /settings/profile; }
location = /admin { return 302 /settings/admin; }

# Intellivix branding assets — 항상 최신(no-store). 순정 index.html 캐시여도 env.js 로 적용됨.

location = /env.js {
    add_header Cache-Control "no-store" always;
    default_type application/javascript;
}

location = /ivx-sidebar.css {
    add_header Cache-Control "no-store" always;
}

location = /ivx-sidebar.js {
    add_header Cache-Control "no-store" always;
    default_type application/javascript;
}

location = /ivx-dashboard.js {
    add_header Cache-Control "no-store" always;
    default_type application/javascript;
}

location = /ivx-dataset-branch.css { add_header Cache-Control "no-store" always; }
location = /ivx-dataset-branch.js { add_header Cache-Control "no-store" always; default_type application/javascript; }
