location /training-api/ {
    resolver 127.0.0.11 valid=10s;
    set $annotation_upstream http://annotation-api:8091;
    rewrite ^/training-api/(.*)$ /$1 break;
    proxy_pass $annotation_upstream;
    client_max_body_size 16m;
    proxy_read_timeout 180s;
}

# VLM 모델 폴더는 최대 수십 GB라 다운로드가 오래 걸릴 수 있음. 버퍼링 없이
# 그대로 흘려보내고 읽기 타임아웃을 길게 준다.
location ~ ^/training-api/deploy/(detector|vlm)/download {
    resolver 127.0.0.11 valid=10s;
    set $annotation_upstream http://annotation-api:8091;
    rewrite ^/training-api/(.*)$ /$1 break;
    proxy_pass $annotation_upstream;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
