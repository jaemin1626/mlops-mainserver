# ──────────────────────────────────────────────────────────────
# 브랜딩 파일이 캐시에 갇히는 것을 막는다.
#
#   ClearML 웹 자산은 main-MY7YNF44.js 처럼 파일명에 내용 해시가 박혀 있다.
#   "이름이 같으면 내용도 같다" 는 약속이지만, 브랜딩은 순정 파일 위에 다른
#   내용을 덮어쓰면서 이름은 그대로 둔다. 약속이 깨진 상태다.
#
#   원래 이 서버는 Cache-Control 을 아예 안 보냈다. 그러면 브라우저가
#   "마지막 수정 시각으로부터 지난 시간의 10%" 같은 자기 나름의 추측으로
#   캐시 기간을 정한다(RFC 7234 heuristic freshness). 그 기간 동안은 요청
#   자체를 안 보내므로, 서버가 새 파일을 갖고 있어도 전달할 방법이 없다.
#   그래서 예전에 순정 ClearML 을 봤던 브라우저가 계속 순정 화면을 보여줬다.
#
# ── 왜 add_header 가 아니라 expires 인가 ──────────────────────────
#
#   이 파일은 sites-available/default 의 server 블록 안에서 include 된다.
#   그런데 nginx 의 add_header 는 "하위 블록에 add_header 가 하나라도
#   있으면 상위 것을 전부 버린다". 정적 파일을 내보내는 location / 에는
#   이미 HSTS·CSP 등 add_header 가 여러 개 있어서, 여기서 add_header 로
#   Cache-Control 을 걸면 그 파일들에는 도달하지 못한다. 실제로 걸어 보면
#   응답에 Cache-Control 이 안 붙는다.
#
#   expires 는 그 규칙을 안 따른다. 하위 블록이 expires 를 다시 정의하지
#   않으면 그대로 물려받는다. location / 에는 expires 가 없으므로 적용된다.
#   음수 값은 Cache-Control: no-cache 를 뜻한다.
#
#   no-cache 는 "받아두되 쓰기 전에 항상 물어봐라" 는 뜻이다. no-store 가
#   아니므로 매번 다시 받지 않는다. 내용이 그대로면 ETag 로 304 가 떨어지고
#   본문은 안 온다. 이 서버는 이미 모든 응답에 ETag 를 붙이고 있다.
#
#   /api, /files 프록시도 함께 물려받는다. API 응답은 원래 캐시 대상이
#   아니라 무해하고, 아티팩트 다운로드는 재검증 한 번이 추가되는 정도다.
#
#   되돌리려면 이 파일을 지우고 nginx 를 다시 읽히면 된다.
#     docker exec clearml-webserver nginx -s reload
# ──────────────────────────────────────────────────────────────

expires -1;
