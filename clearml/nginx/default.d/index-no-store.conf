# ──────────────────────────────────────────────────────────────
# index.html 을 브라우저가 저장조차 하지 못하게 한다.
#
# ── 무엇을 고치는 건가 ───────────────────────────────────────────
#
#   액세스 로그로 확인한 실제 증상(2026-08-25):
#
#     01:20:28  /configuration.json  200   Referer: http://172.16.4.82:8080/
#     01:20:32  /dashboard           200   9350
#     01:20:32  /main-7G55WGQS.js    200  52507
#
#   `/` 문서가 화면에서 돌고 있는데 `GET /` 요청은 로그에 없다. 브라우저가
#   저장해 둔 문서를 서버에 묻지도 않고 그대로 쓴 것이다. 그 문서는 브랜딩
#   전의 순정 index.html 이라 순정 화면이 뜬다. 잠시 뒤 앱이 /dashboard 로
#   전체 페이지 이동을 하면서 비로소 서버에 물어보고 브랜딩판을 받는다.
#   사용자에게는 "처음엔 순정, 새로고침하면 커스텀" 으로 보인다.
#
#   해시가 박힌 자산(main-*.js 등)은 내용이 바뀌면 이름도 바뀌므로 이런 일이
#   생길 수 없다. index.html 은 이름이 고정이라 이 앱에서 유일하게 캐시에
#   갇힐 수 있는 파일이고, 실제로 그 일이 일어났다.
#
#   cache-control.conf 의 expires -1 은 Cache-Control: no-cache 를 준다.
#   "저장은 하되 쓰기 전에 물어봐라" 이므로 물어보기만 하면 최신을 받는다.
#   하지만 저장본이 존재하는 한, 세션 복원이나 뒤로가기 캐시처럼 HTTP 캐시
#   재검증을 건너뛰는 경로로 그 저장본이 화면에 올라올 수 있다.
#   no-store 는 저장 자체를 금지한다. 저장본이 없으면 올라올 것도 없다.
#
#   문서는 gzip 후 9KB 이고 로컬 디스크에서 나가므로 비용은 사실상 없다.
#
# ── 왜 헤더를 다시 나열하는가 ────────────────────────────────────
#
#   순정 설정은 `/` 요청을 location / 로 받아 try_files 로 /index.html 에
#   내부 리다이렉트한다. 그때 location 매칭이 다시 일어나므로, 여기에
#   location = /index.html 을 두면 문서 응답은 이 블록이 담당하게 된다.
#   즉 순정 location / 의 add_header 들이 문서 응답에 더는 붙지 않는다.
#   특히 CSP frame-ancestors 는 문서를 iframe 에 넣는 공격을 막는 것이라
#   문서에서 잃으면 안 된다. 그래서 순정이 주던 값을 always 여부까지
#   그대로 옮겨 적는다. 출처는 /etc/nginx/sites-enabled/default 의 216~222 행.
#
#   ⚠ ClearML 이미지를 올리면 순정 헤더 목록이 달라질 수 있다. 그때는
#     아래와 실제 순정 설정을 다시 맞춰야 한다. 확인 방법:
#       docker exec clearml-webserver nginx -T | grep -n add_header
#     기준: clearml/server:2.3.0-705 / 2026-08-25 확인
#
#   root 는 적지 않는다. 순정 server 블록(190 행)에 있으므로 물려받는다.
#   여기에 경로를 박아 두면 이미지가 경로를 바꿀 때 같이 깨진다.
#
# ── 부작용 ──────────────────────────────────────────────────────
#
#   no-store 문서는 뒤로가기 캐시(bfcache) 대상에서 제외된다. 뒤로가기로
#   돌아올 때 SPA 가 다시 부팅될 수 있다. 다만 Angular 라우터가 화면 전환을
#   클라이언트에서 처리하므로 문서 이동 자체가 드물어 영향은 작다.
#
#   되돌리려면 이 파일을 지우고 nginx 를 다시 읽히면 된다.
#     docker exec clearml-webserver nginx -s reload
# ──────────────────────────────────────────────────────────────

location = /index.html {
    # 서버 블록의 expires -1 을 물려받으면 Cache-Control 이 no-cache 와
    # no-store 두 줄로 나간다. 여기서는 끄고 직접 지정한다.
    expires off;
    add_header Cache-Control "no-store" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade";
}
