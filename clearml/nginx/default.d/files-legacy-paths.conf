# Legacy dataset preview paths (after Detector/VLM/Dataset rename, Aug 2026).
# ClearML stores preview image URLs in Elasticsearch; until those are reindexed,
# rewrite old /files/ paths to the new fileserver layout.

location ~ ^/files/Intellivix-Datasets/(?<rest>.+)$ {
    resolver 127.0.0.11 valid=10s;
    set $fileserver_upstream http://fileserver:8081;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_pass $fileserver_upstream/Dataset/$rest;
}

location ~ ^/files/Dataset/\.datasets/detector-dataset/(?<rest>.+)$ {
    resolver 127.0.0.11 valid=10s;
    set $fileserver_upstream http://fileserver:8081;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_pass $fileserver_upstream/Dataset/.datasets/Detector/$rest;
}

location ~ ^/files/Dataset/\.datasets/vlm-dataset/(?<rest>.+)$ {
    resolver 127.0.0.11 valid=10s;
    set $fileserver_upstream http://fileserver:8081;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_pass $fileserver_upstream/Dataset/.datasets/VLM/$rest;
}
