# Native ClearML Dataset deletion is routed through the relationship guard.
location ~ ^/api/v[0-9.]+/tasks\.delete$ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://annotation-api:8091;
    proxy_set_header Connection "";
    client_max_body_size 64k;
}
