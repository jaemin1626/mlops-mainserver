<!doctype html><html><head><meta charset="utf-8"><title>Intellivix MLOps · Training Dashboard</title><style>body{margin:0;background:#10141b;color:#eef3fb;font:14px Arial;padding:40px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:30px}.card{background:#18202c;border:1px solid #2d3a4d;border-radius:14px;padding:24px;text-align:center}.ring{width:180px;height:180px;border-radius:50%;margin:18px auto;background:conic-gradient(#3294ed var(--p),#2c3747 0);display:grid;place-items:center}.ring div{width:132px;height:132px;border-radius:50%;background:#10141b;display:grid;place-items:center;font-size:34px}.label{color:#9db0c8;font-size:16px}.sub{color:#9db0c8;margin-top:12px}.status{float:right;font-size:13px;color:#72e6a5}</style></head><body><h1>TRAINING SERVER · 172.16.4.83 <span id="status" class="status">연결 중</span></h1><div id="grid" class="grid"></div><script>const grid=document.getElementById('grid'),status=document.getElementById('status');function gb(n){return (Number(n||0)/1073741824).toFixed(1)}function card(label,pct,sub){pct=Math.round(Math.max(0,Math.min(100,Number(pct)||0)));return `<div class="card"><div class="label">${label}</div><div class="ring" style="--p:${pct}%"><div>${pct}%</div></div><div class="sub">${sub}</div></div>`}async function poll(){try{const r=await fetch('/training-metrics.json?t='+Date.now());const d=await r.json();if(!d.ok)throw Error(d.error);const m=d.memory||{},g=(d.gpus||[])[0]||{};grid.innerHTML=card('CPU USAGE',d.cpu_percent,'전체 CPU 사용률')+card('GPU USAGE',g.utilization_percent,`${d.gpus.length} GPU · ${g.memory_used_mb||0}/${g.memory_total_mb||0} MB VRAM`)+card('MEMORY USAGE',Number(m.used_bytes||0)/Number(m.total_bytes||1)*100,`${gb(m.used_bytes)} / ${gb(m.total_bytes)} GB RAM`);status.textContent='LIVE · '+new Date((d.updated_at||d.timestamp)*1000).toLocaleTimeString()}catch(e){status.textContent='연결 실패';status.style.color='#ff8b8b';grid.innerHTML=card('CPU USAGE',0,e.message)}}poll();setInterval(poll,5000)</script></body></html>
