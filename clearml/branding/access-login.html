<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intellivix MLOps 로그인</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 0,#182a45,#080f19 55%);font:14px Arial;color:#eef4ff}.box{width:min(410px,92vw);padding:34px;border:1px solid #2a3d56;border-radius:14px;background:#0d1826;box-shadow:0 24px 70px #0008}h1{margin:0 0 8px;font-size:25px}.muted{color:#93a8c4;margin-bottom:26px}label{display:block;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #304763;border-radius:7px;background:#111f31;color:#fff}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:7px;background:#4b82f5;color:#fff;font-weight:700;cursor:pointer}.error{min-height:20px;margin-top:13px;color:#ff8e9b}</style></head><body><form class="box"><h1>Intellivix MLOps</h1><div class="muted">관리자가 발급한 계정으로 로그인하세요.</div><label>아이디</label><input name="username" autocomplete="username" required autofocus><label>비밀번호</label><input name="password" type="password" autocomplete="current-password" required><button>로그인</button><div class="error"></div></form><script>fetch('/access-api/auth/me',{credentials:'same-origin'}).then(async r=>{if(r.ok){let d=await r.json();location.replace(d.must_change_password?'/change-password.html':'/')}});document.querySelector('form').onsubmit=async e=>{e.preventDefault();let b=e.currentTarget.querySelector('button'),m=e.currentTarget.querySelector('.error');b.disabled=true;m.textContent='';try{let f=new FormData(e.currentTarget),r=await fetch('/access-api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})}),d=await r.json();if(!r.ok)throw Error(d.error||'로그인 실패');location.replace(d.must_change_password?'/change-password.html':'/')}catch(x){m.textContent=x.message;b.disabled=false}};</script></body></html>
