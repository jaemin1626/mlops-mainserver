<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111d;font:14px Arial;color:#eef4ff}.box{width:min(430px,92vw);padding:32px;border:1px solid #2b405a;border-radius:14px;background:#0e1a29}h1{margin-top:0}label{display:block;margin:15px 0 7px}input{width:100%;padding:13px;background:#132238;border:1px solid #304963;border-radius:7px;color:#fff}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:7px;background:#4b82f5;color:#fff;font-weight:700}.error{color:#ff8d9a;min-height:20px;margin-top:12px}</style></head><body><form class="box"><h1>비밀번호 변경</h1><p>첫 로그인 시 안전한 새 비밀번호로 변경해야 합니다.</p><label>현재 비밀번호</label><input name="current" type="password" required><label>새 비밀번호 (5자 이상)</label><input name="next" type="password" minlength="5" required><label>새 비밀번호 확인</label><input name="confirm" type="password" minlength="5" required><button>변경 후 시작</button><div class="error"></div></form><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),m=e.target.querySelector('.error');if(f.get('next')!==f.get('confirm'))return m.textContent='새 비밀번호가 일치하지 않습니다.';let r=await fetch('/access-api/auth/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:f.get('current'),new_password:f.get('next')})}),d=await r.json();if(!r.ok)return m.textContent=d.error||'변경 실패';location.replace('/')};</script></body></html>
