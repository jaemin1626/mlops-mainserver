global:
  scrape_interval:     30s
  evaluation_interval: 30s
  scrape_timeout:      20s

scrape_configs:
  - job_name: "clearml-exporter"
    static_configs:
      - targets: ["clearml-exporter:9090"]
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [task_name]
        regex: "(.{80}).*"
        replacement: "${1}..."
        target_label: task_name

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9091"]
