apiVersion: 1

providers:
  - name: "ClearML Dashboards"
    orgId: 1
    folder: "ClearML"
    folderUid: "clearml"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
