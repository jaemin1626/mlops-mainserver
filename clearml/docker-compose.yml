services:

  training-ssh:
    profiles: [training-ssh]
    image: clearml-training-ssh:local
    user: "${TRAINING_SSH_UID:-1000}:${TRAINING_SSH_GID:-1000}"
    build:
      context: ./training_ssh
      args:
        TRAINING_SSH_UID: ${TRAINING_SSH_UID:-1000}
        TRAINING_SSH_GID: ${TRAINING_SSH_GID:-1000}
    environment:
      TRAINING_SSH_HOST: ${TRAINING_SSH_HOST:-${TRAINING_SERVER_IP:-}}
      TRAINING_SSH_PORT: ${TRAINING_SSH_PORT:-22}
      TRAINING_SSH_USER: ${TRAINING_SSH_USER:-intellivix}
      TRAINING_SSH_ROOT: ${TRAINING_SSH_ROOT:-/home/intellivix/train}
      TRAINING_SSH_SCRIPT: ${TRAINING_SSH_SCRIPT:-./scripts/remote_train.sh}
      TRAINING_SSH_TEST_SCRIPT: ${TRAINING_SSH_TEST_SCRIPT:-}
      TRAINING_SSH_KEY_FILE: /run/training-ssh/id_ed25519
      TRAINING_SSH_KNOWN_HOSTS: /run/training-ssh/known_hosts
    volumes:
      - type: bind
        source: ${TRAINING_SSH_DIR:-./ssh}
        target: /run/training-ssh
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - frontend

  access-control:
    build: ./access_control
    image: clearml-access-control:local
    container_name: clearml-access-control
    restart: unless-stopped
    environment:
      ACCESS_DB: /data/access.db
      ACCESS_ALLOWED_ORIGIN: http://${CLEARML_SERVER_IP}:8080
      CLEARML_API: http://apiserver:8008
      CLEARML_FIXED_USERS_FILE: /config/fixed-users.json
      INITIAL_ADMIN_USERNAME: ${CLEARML_LOGIN_USER:-admin}
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: "27017"
    volumes:
      - ${CLEARML_DIR_PATH:-/opt/clearml}/access_control/data:/data
      - ${CLEARML_DIR_PATH:-/opt/clearml}/config:/config
    depends_on:
      - apiserver
    # backend: mongo에 직접 붙어 새 계정의 ClearML 프로필(backend.user)을
    # apiserver 재시작 없이 즉시 만들기 위함 (ensure_clearml_profile 참고)
    networks: [frontend, backend]

  apiserver:
    build:
      context: ./access_control
      dockerfile: Dockerfile.apiserver
    command:
    - apiserver
    container_name: clearml-apiserver
    image: clearml-apiserver-intellivix:2.3.0-705
    restart: unless-stopped
    volumes:
    - ${CLEARML_DIR_PATH:-/opt/clearml}/logs:/var/log/clearml
    - ${CLEARML_DIR_PATH:-/opt/clearml}/config:/opt/clearml/config
    - ${CLEARML_DIR_PATH:-/opt/clearml}/data/fileserver:/mnt/fileserver
    depends_on:
      - redis
      - mongo
      - elasticsearch
      - fileserver
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML_FIXED_USERS_FILE: /opt/clearml/config/fixed-users.json
      CLEARML__apiserver__pre_populate__enabled: "false"
      CLEARML__apiserver__pre_populate__zip_files: "/opt/clearml/db-pre-populate"
      CLEARML__apiserver__pre_populate__artifacts_path: "/mnt/fileserver"
      CLEARML__services__async_urls_delete__enabled: "true"
      CLEARML__services__async_urls_delete__fileserver__url_prefixes: "[${CLEARML_FILES_HOST:-}]"
      CLEARML__secure__credentials__services_agent__user_key: ${CLEARML_AGENT_ACCESS_KEY:-}
      CLEARML__secure__credentials__services_agent__user_secret: ${CLEARML_AGENT_SECRET_KEY:-}
      # 서버 고유 서명 키. 비워두면 GitHub 에 공개된 ClearML 기본 키를 쓰게 되므로
      # 값이 없으면 아예 기동을 막는다. packaging/gen-secrets.sh 로 만든다.
      CLEARML__secure__auth__token_secret: ${CLEARML_TOKEN_SECRET:?gen_secrets.sh 를 먼저 실행하세요}
      CLEARML__secure__http__session_secret__apiserver: ${CLEARML_SESSION_SECRET:?gen_secrets.sh 를 먼저 실행하세요}
    ports:
    - "8008:8008"
    networks:
      - backend
      - frontend

  elasticsearch:
    networks:
      - backend
    container_name: clearml-elastic
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: clearml
      cluster.routing.allocation.node_initial_primaries_recoveries: "500"
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      discovery.type: "single-node"
      http.compression_level: "7"
      node.name: clearml
      reindex.remote.whitelist: "'*.*'"
      xpack.security.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    image: elasticsearch:8.17.0
    restart: unless-stopped
    volumes:
      - ${CLEARML_DIR_PATH:-/opt/clearml}/data/elastic_7:/usr/share/elasticsearch/data
      - /usr/share/elasticsearch/logs

  fileserver:
    networks:
      - backend
      - frontend
    command:
    - fileserver
    container_name: clearml-fileserver
    image: clearml/server:2.3.0-705
    environment:
      CLEARML__fileserver__delete__allow_batch: "true"
      CLEARML__secure__auth__token_secret: ${CLEARML_TOKEN_SECRET:?gen_secrets.sh 를 먼저 실행하세요}
    restart: unless-stopped
    volumes:
    - ${CLEARML_DIR_PATH:-/opt/clearml}/logs:/var/log/clearml
    - ${CLEARML_DIR_PATH:-/opt/clearml}/data/fileserver:/mnt/fileserver
    - ${CLEARML_DIR_PATH:-/opt/clearml}/config:/opt/clearml/config
    ports:
    - "8081:8081"

  mongo:
    networks:
      - backend
    container_name: clearml-mongo
    image: mongo:7.0.22
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
    - ${CLEARML_DIR_PATH:-/opt/clearml}/data/mongo_4/db:/data/db
    - ${CLEARML_DIR_PATH:-/opt/clearml}/data/mongo_4/configdb:/data/configdb

  redis:
    networks:
      - backend
    container_name: clearml-redis
    image: redis:7.4.1
    restart: unless-stopped
    volumes:
    - ${CLEARML_DIR_PATH:-/opt/clearml}/data/redis:/data

  webserver:
    command:
    - webserver
    container_name: clearml-webserver
    # branding·nginx 를 이미지에 박아 넣음. bind mount 로 순정 파일이 새는 일 없음.
    # 갱신: packaging/build-webserver-image.sh → compose up --force-recreate webserver
    image: clearml-webserver-intellivix:20260825
    build:
      context: ${CLEARML_DIR_PATH:-/opt/clearml}
      dockerfile: branding/Dockerfile.webserver
    restart: unless-stopped
    # nginx 설정·index.html 은 자주 바꾸므로 mount (JS/CSS 등 자산은 이미지에 포함)
    volumes:
    - ${CLEARML_DIR_PATH:-/opt/clearml}/nginx/default.d:/etc/nginx/default.d:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/index.html:/usr/share/nginx/html/index.html:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/admin-embedded.html:/usr/share/nginx/html/admin-embedded.html:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/access-login.html:/usr/share/nginx/html/access-login.html:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/change-password.html:/usr/share/nginx/html/change-password.html:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/env.js:/usr/share/nginx/html/env.js:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/ivx-sidebar.css:/usr/share/nginx/html/ivx-sidebar.css:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/ivx-sidebar.js:/usr/share/nginx/html/ivx-sidebar.js:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/ivx-admin-app.js:/usr/share/nginx/html/ivx-admin-app.js:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/ivx-dataset-branch.css:/usr/share/nginx/html/ivx-dataset-branch.css:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/ivx-dataset-branch.js:/usr/share/nginx/html/ivx-dataset-branch.js:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/train:/usr/share/nginx/html/train:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/ivx-dashboard.js:/usr/share/nginx/html/ivx-dashboard.js:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/training-metrics.json:/usr/share/nginx/html/training-metrics.json:ro
    - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/training-dashboard.html:/usr/share/nginx/html/training-dashboard.html:ro
    depends_on:
      - apiserver
      - data-studio
      - seoul-studio
      - access-control
    ports:
    - "8080:80"
    networks:
      - backend
      - frontend

  data-studio:
    image: clearml-data-studio:pin-20260826-v4
    build:
      context: ${MLOPS_ROOT:-/opt}/data_studio
      dockerfile: Dockerfile
    container_name: clearml-data-studio
    restart: unless-stopped
    environment:
      DATA_STUDIO_PORT: "8091"
      DATA_STUDIO_ALLOWED_ROOTS: /data/datasets:/data/generate_datasets
      ACCESS_CONTROL_URL: http://access-control:8095
    volumes:
      - ${DATASET_EXPORT_PATH:-./data/datasets}:/data/datasets
      - ${GENERATED_EXPORT_PATH:-/home/intellivix/train/ComfyUI/generate_datasets}:/data/generate_datasets
    depends_on: [access-control]
    networks:
      - frontend

  seoul-studio:
    image: clearml-seoul-studio:pin-20260903-v1
    build:
      context: ${MLOPS_ROOT:-/opt}/ComfyUI_seoul
      dockerfile: Dockerfile
    container_name: clearml-seoul-studio
    restart: unless-stopped
    environment:
      SEOUL_STUDIO_PORT: "7860"
      SEOUL_STUDIO_BASE_PATH: /seoul-studio
      SEOUL_STUDIO_OUTPUT_DIR: /data/output
      SEOUL_STUDIO_DATASETS_DIR: /data/datasets
      SEOUL_STUDIO_HOST_OUTPUT_DIR: ${MLOPS_GENERATED_MOUNT_PATH:-/home/intellivix/train/ComfyUI/generate_datasets}
      SEOUL_STUDIO_CONFIG: /data/config/config.json
      SEOUL_STUDIO_COMFY_URL: ${SEOUL_STUDIO_COMFY_URL:?apply_env.sh 를 먼저 실행하세요}
      SEOUL_STUDIO_BLUR_WEIGHTS: ${SEOUL_STUDIO_BLUR_WEIGHTS:-/data/models/anonymize/best.pt}
      SEOUL_STUDIO_BLUR_RATIO: ${SEOUL_STUDIO_BLUR_RATIO:-10}
      SEOUL_STUDIO_BLUR_CONF: ${SEOUL_STUDIO_BLUR_CONF:-0.25}
      CLEARML_API_HOST: http://apiserver:8008
      ACCESS_CONTROL_URL: http://access-control:8095
      CLEARML_API_ACCESS_KEY: ${CLEARML_AGENT_ACCESS_KEY:-${CLEARML_ACCESS_KEY:-}}
      CLEARML_API_SECRET_KEY: ${CLEARML_AGENT_SECRET_KEY:-${CLEARML_SECRET_KEY:-}}
    volumes:
      - ${GENERATED_EXPORT_PATH:-/home/intellivix/train/ComfyUI/generate_datasets}:/data/output
      - ${DATASET_EXPORT_PATH:-./data/datasets}:/data/datasets
      - ${SEOUL_STUDIO_CONFIG_PATH:-../ComfyUI_seoul/data/config}:/data/config
      - ${BLUR_WEIGHTS_DIR:-./models/anonymize}:/data/models/anonymize:ro
    depends_on: [access-control]
    networks:
      - frontend
      - backend

  annotation-api:
    user: "${TRAINING_SSH_UID:-1000}:${TRAINING_SSH_GID:-1000}"
    profiles: [training-ssh]
    image: clearml-training-ssh:local
    build: { context: ./training_ssh }
    entrypoint: ["python", "/app/annotation_api.py"]
    restart: unless-stopped
    environment:
      ANNOTATION_ALLOWED_ORIGIN: http://${CLEARML_SERVER_IP}:8080
      TRAINING_ANNOTATION_DIR: ${TRAINING_ANNOTATION_DIR:-/home/intellivix/train/Detector/annotation}
      TRAINING_IMAGE_ROOT: ${TRAINING_IMAGE_ROOT:-/workspace/Dataset/detector}
      TRAINING_SSH_HOST: ${TRAINING_SSH_HOST:-${TRAINING_SERVER_IP:-}}
      TRAINING_SSH_PORT: ${TRAINING_SSH_PORT:-22}
      TRAINING_SSH_USER: ${TRAINING_SSH_USER:-intellivix}
      TRAINING_SSH_ROOT: ${TRAINING_SSH_ROOT:-/home/intellivix/train}
      CLEARML_FILES_HOST: ${CLEARML_FILES_HOST:-}
      ANNOTATION_API_PORT: 8091
      ACCESS_CONTROL_URL: http://access-control:8095
      DEPLOY_HISTORY_FILE: /data/deploy/history.json
      TRAINING_DATASET_LOCAL_ROOT: /data/datasets/detector
      TRAINING_SSH_KEY_FILE: /run/keys/id_ed25519
      TRAINING_SSH_KNOWN_HOSTS: /run/keys/known_hosts
    volumes:
      - ${CLEARML_DIR_PATH:-/opt/clearml}/ssh:/run/keys:ro
      - ${CLEARML_DIR_PATH:-/opt/clearml}/data/datasets/detector:/data/datasets/detector:ro
      - ${CLEARML_DIR_PATH:-/opt/clearml}/training_ssh/data:/data/deploy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [access-control]
    networks: [frontend]

  training-metrics:
    profiles: [training-ssh]
    image: clearml-training-ssh:local
    build: { context: ./training_ssh }
    entrypoint: ["python"]
    command: ["/app/metrics_poller.py"]
    restart: unless-stopped
    environment:
      TRAINING_SSH_HOST: ${TRAINING_SSH_HOST:-${TRAINING_SERVER_IP:-}}
      TRAINING_SSH_USER: ${TRAINING_SSH_USER:-intellivix}
      TRAINING_SSH_PORT: ${TRAINING_SSH_PORT:-22}
      TRAINING_SSH_ROOT: ${TRAINING_SSH_ROOT:-/home/intellivix/train}
      TRAINING_SSH_METRICS_SCRIPT: ${TRAINING_SSH_METRICS_SCRIPT:-./scripts/check_metrics.sh}
      TRAINING_METRICS_INTERVAL_SEC: ${TRAINING_METRICS_INTERVAL_SEC:-5}
      TRAINING_METRICS_OUTPUT: /run/metrics/training-metrics.json
      TRAINING_SSH_KEY_FILE: /run/keys/id_ed25519
      TRAINING_SSH_KNOWN_HOSTS: /run/keys/known_hosts
    volumes:
      - ${CLEARML_DIR_PATH:-/opt/clearml}/ssh:/run/keys:ro
      - ${CLEARML_DIR_PATH:-/opt/clearml}/branding/training-metrics.json:/run/metrics/training-metrics.json
    networks: [frontend]

  model-eval-console:
    image: clearml-model-eval-console:pin-20260821
    build:
      context: ./model_eval_console
      dockerfile: Dockerfile
    container_name: model-eval-console
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MODEL_EVAL_MONGO_URI: mongodb://mongo:27017
      MODEL_EVAL_MONGO_DB: backend
      MODEL_EVAL_ELASTIC_URI: http://elasticsearch:9200
      MODEL_EVAL_DB_PATH: /app/data/console.db
      MODEL_EVAL_DEFAULT_QUEUE: eval-windows
    volumes:
      - ${CLEARML_DIR_PATH:-/opt/clearml}/model_eval_console/data:/app/data
    ports:
      - "8090:8090"
    networks:
      - backend
      - frontend

  async_delete:
    depends_on:
      - apiserver
      - redis
      - mongo
      - elasticsearch
      - fileserver
    container_name: async_delete
    image: clearml/server:2.3.0-705
    networks:
      - backend
    restart: unless-stopped
    environment:
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      PYTHONPATH: /opt/clearml/apiserver
      CLEARML__services__async_urls_delete__fileserver__url_prefixes: "[${CLEARML_FILES_HOST:-}]"
    entrypoint:
      - python3
      - -m
      - jobs.async_urls_delete
      - --fileserver-host
      - http://fileserver:8081
    volumes:
      - ${CLEARML_DIR_PATH:-/opt/clearml}/logs:/var/log/clearml
      - ${CLEARML_DIR_PATH:-/opt/clearml}/config:/opt/clearml/config

  agent-services:
    networks:
      - backend
    container_name: clearml-agent-services
    image: clearml/clearml-agent-services:latest
    deploy:
      restart_policy:
        condition: on-failure
    privileged: true
    environment:
      CLEARML_HOST_IP: ${CLEARML_HOST_IP}
      CLEARML_WEB_HOST: ${CLEARML_WEB_HOST:-}
      CLEARML_API_HOST: http://apiserver:8008
      CLEARML_FILES_HOST: ${CLEARML_FILES_HOST:-}
      CLEARML_API_ACCESS_KEY: ${CLEARML_AGENT_ACCESS_KEY:-${CLEARML_ACCESS_KEY:-}}
      CLEARML_API_SECRET_KEY: ${CLEARML_AGENT_SECRET_KEY:-${CLEARML_SECRET_KEY:-}}
      CLEARML_AGENT_GIT_USER: ${CLEARML_AGENT_GIT_USER:-}
      CLEARML_AGENT_GIT_PASS: ${CLEARML_AGENT_GIT_PASS:-}
      CLEARML_AGENT_UPDATE_VERSION: ${CLEARML_AGENT_UPDATE_VERSION:->=0.17.0}
      CLEARML_AGENT_DEFAULT_BASE_DOCKER: "ubuntu:18.04"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      CLEARML_WORKER_ID: "clearml-services"
      CLEARML_AGENT_DOCKER_HOST_MOUNT: "${CLEARML_DIR_PATH:-/opt/clearml}/agent:/root/.clearml"
      SHUTDOWN_IF_NO_ACCESS_KEY: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLEARML_DIR_PATH:-/opt/clearml}/agent:/root/.clearml
    depends_on:
      - apiserver
    entrypoint: >
      bash -c "curl --retry 10 --retry-delay 10 --retry-connrefused 'http://apiserver:8008/debug.ping' && /usr/agent/entrypoint.sh"

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
